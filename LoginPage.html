<button id="theme-toggle-btn" class="btn btn-dark theme-btn-login" onclick="toggleTheme()" title="Cambiar Tema">
    <i class="fas fa-moon"></i>
</button>
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="login-card-container" style="max-width: 480px; width: 100%;">
        <div class="card o-hidden border-0 shadow-lg">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <!-- Logos Institucionales Oficiales -->
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <img src="assets/img/logo_minhvi.png" onerror="this.onerror=null; this.src='assets/img/logo_minhvi.svg'" alt="Minhvi" class="img-fluid mr-3" style="max-height: 48px; object-fit: contain;">
                        <div style="height: 38px; width: 1px; background: #e3e6f0; margin: 0 4px;"></div>
                        <img src="assets/img/logo_constructora_alba.png" onerror="this.onerror=null; this.src='assets/img/logo_constructora_alba.svg'" alt="Constructora del Alba" class="img-fluid ml-3" style="max-height: 48px; object-fit: contain;">
                    </div>
                    
                    <!-- Jerarquía Institucional Oficial Obligatoria -->
                    <h6 class="font-weight-bold text-uppercase text-secondary mb-1" style="font-size: 0.78rem; letter-spacing: 0.6px; line-height: 1.3;">
                        Ministerio del Poder Popular para Hábitat y Vivienda
                    </h6>
                    <h5 class="font-weight-bold text-primary mb-2" style="font-size: 1.18rem; letter-spacing: 0.3px;">
                        Constructora del Alba Bolivariana
                    </h5>
                    <div class="badge badge-light border text-muted px-3 py-1 font-weight-normal mb-1">
                        <i class="fas fa-qrcode mr-1 text-primary"></i> Control de Asistencia Semanal
                    </div>
                </div>
                <form class="user" id="login-form">
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-gray-700 ml-1 mb-1">Usuario o Cédula:</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0"><i class="fas fa-id-card text-muted"></i></span>
                            </div>
                            <input type="text" class="form-control form-control-user border-left-0" id="email" aria-describedby="emailHelp" placeholder="Primer Nombre (ej. brando) o Cédula..." required autocomplete="username">
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-gray-700 ml-1 mb-1">Contraseña:</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text bg-light border-right-0"><i class="fas fa-lock text-muted"></i></span>
                            </div>
                            <input type="password" class="form-control form-control-user border-left-0" id="password" placeholder="Contraseña..." required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm py-2">
                        <i class="fas fa-sign-in-alt mr-1"></i> Iniciar Sesión
                    </button>
                </form>
                <div id="login-spinner" class="text-center mt-3" style="display: none;">
                    <div class="spinner-border text-primary spinner-border-sm" role="status">
                        <span class="sr-only">Cargando...</span>
                    </div>
                    <span class="small text-muted ml-2">Verificando credenciales...</span>
                </div>
                <div id="login-error" class="text-center text-danger small mt-3" style="display: none;">
                    <i class="fas fa-exclamation-circle mr-1"></i> Usuario o contraseña incorrectos.
                </div>
            </div>
        </div>
    </div>
</div>
